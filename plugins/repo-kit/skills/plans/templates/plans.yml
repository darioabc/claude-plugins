# Keeps docs/plans/ honest and ties every pull request to a plan.
#
# Two checks, one script (scripts/plans.mjs, from the repo-kit plugin):
#
#   - every plan file parses: a status from the fixed vocabulary, an Updated
#     date, a unique ticket prefix, tickets with a status;
#   - the PR body carries a "Plan:" line naming a plan that exists and
#     tickets that are in it, or "Plan: none, <reason>" for a one-off.
#
# On pull_request only: this is a review-time discipline, not something to
# block a deploy over.
name: Plans

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The body goes through an env var and a file, never into the shell
      # line, so nothing in a PR description can run as a command here.
      - name: Write the PR body to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr-body.txt
      - run: node scripts/plans.mjs --pr-body /tmp/pr-body.txt
